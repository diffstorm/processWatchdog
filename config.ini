[processWatchdog]
udp_port = 12345
periodic_reboot = OFF

[app:Communicator]
start_delay = 10
heartbeat_delay = 60
heartbeat_interval = 20
cmd = /usr/bin/python test_child.py 1 crash
# Restart policy with exponential backoff (optional)
# max_retries = 5
# base_delay = 1
# stop_timeout = 30

[app:Bot]
start_delay = 20
heartbeat_delay = 90
heartbeat_interval = 30
cmd = /usr/bin/python test_child.py 2 noheartbeat
# Restart policy with exponential backoff (optional)
# max_retries = 5
# base_delay = 1
# stop_timeout = 30

[app:Publisher]
start_delay = 35
heartbeat_delay = 70
heartbeat_interval = 16
cmd = /usr/bin/python test_child.py 3 crash
# Restart policy with exponential backoff (optional)
# max_retries = 5
# base_delay = 1
# stop_timeout = 30

[app:Alert]
start_delay = 35
heartbeat_delay = 130
heartbeat_interval = 13
cmd = /usr/bin/python test_child.py 4 noheartbeat
# Restart policy with exponential backoff (optional)
# max_retries = 5
# base_delay = 1
# stop_timeout = 30

[app:BackoffTest]
start_delay = 5
heartbeat_delay = 10
heartbeat_interval = 60
cmd = /usr/bin/python test_child.py 5 crash
# Restart policy with exponential backoff
max_retries = 3
base_delay = 2
stop_timeout = 30

[app:ProgressTest]
start_delay = 5
heartbeat_delay = 10
heartbeat_interval = 15
progress_timeout = 30
cmd = /usr/bin/python test_child.py 6 crash 10
# Send heartbeat and progress signal (+) every 10 seconds
# progress_timeout=30 in watchdog means restart if no progress in 30 seconds

[app:FlapTest]
start_delay = 10
heartbeat_delay = 60
heartbeat_interval = 20
cmd = /usr/bin/python test_child.py 7 crash
# Circuit-breaker: 3 failures in 10 minutes opens circuit
circuit_breaker_threshold = 3
circuit_breaker_window = 600
# Cooldown: wait 5 minutes before auto-resume, require manual ack after 2 cooldowns
cooldown_period = 300
cooldown_manual_ack_threshold = 2

[app:CircuitTest]
start_delay = 5
heartbeat_delay = 30
heartbeat_interval = 15
cmd = /usr/bin/python test_child.py 8 crash
# Circuit-breaker test: 2 failures in 5 minutes
circuit_breaker_threshold = 2
circuit_breaker_window = 300
# Cooldown: auto-resume after 2 minutes
cooldown_period = 120
cooldown_manual_ack_threshold = 0