[processWatchdog]
udp_port = 12345
periodic_reboot = OFF

[app:Communicator]
start_delay = 10
heartbeat_delay = 60
heartbeat_interval = 20
cmd = /usr/bin/python test_child.py 1 crash
# Restart policy with exponential backoff (optional)
# max_retries = 5
# base_delay = 1

[app:Bot]
start_delay = 20
heartbeat_delay = 90
heartbeat_interval = 30
cmd = /usr/bin/python test_child.py 2 noheartbeat
# Restart policy with exponential backoff (optional)
# max_retries = 5
# base_delay = 1

[app:Publisher]
start_delay = 35
heartbeat_delay = 70
heartbeat_interval = 16
cmd = /usr/bin/python test_child.py 3 crash
# Restart policy with exponential backoff (optional)
# max_retries = 5
# base_delay = 1

[app:Alert]
start_delay = 35
heartbeat_delay = 130
heartbeat_interval = 13
cmd = /usr/bin/python test_child.py 4 noheartbeat
# Restart policy with exponential backoff (optional)
# max_retries = 5
# base_delay = 1

[app:BackoffTest]
start_delay = 5
heartbeat_delay = 10
heartbeat_interval = 60
cmd = /usr/bin/python test_child.py 5 crash
# Restart policy with exponential backoff
max_retries = 3
base_delay = 2